<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Projects | Portfolio</title>
  <style>
    /* ===== CSS RESET ===== */
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ===== THEME VARIABLES ===== */
    :root {
      --bg: #f5f6fa;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #6366f1; /* indigo */
    }

    body.dark {
      --bg: #0f1020;
      --card: #1a1b3a;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #8b5cf6; /* purple */
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      transition: background 0.4s ease, color 0.4s ease;
      animation: pageFade 1.6s ease;
    }

    @keyframes pageFade{
      from{opacity:0; transform:translateY(10px)}
      to{opacity:1; transform:translateY(0)}
    }

    header {
      padding: 1.5rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 { font-size: 1.5rem; font-weight: 700; }

    .theme-toggle {
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      font-weight: 600;
    }


    main {
      padding: 2rem;
      animation: fadeIn 0.6s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 1.5rem;
    }

    .project-card {
      background: var(--card);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      transition: transform 0.3s ease, box-shadow 0.3s ease, opacity 0.6s ease;
      opacity: 0;
      transform: translateY(20px);
    }

    .project-card.show {
      opacity: 1;
      transform: translateY(0);
    }

    .project-card:hover {
      transform: translateY(-8px) scale(1.02);
      box-shadow: 0 20px 40px rgba(0,0,0,0.18);
    }

    .project-card h3 { margin-bottom: 0.5rem; font-size: 1.2rem; }
    .project-card p { font-size: 0.95rem; color: var(--muted); margin-bottom: 1rem; }

    .project-links a {
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--accent);
      margin-right: 1rem;
    }

    footer {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.85rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>My Projects</h1>
    <button class="theme-toggle" id="themeToggle">Toggle Theme</button>
  </header>



  <main>
    <section class="projects-grid" id="projectsGrid"></section>
  </main>

  <!-- MODAL -->
  <div id="modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:1000;">
    <div style="background:var(--card);color:var(--text);padding:2rem;border-radius:16px;max-width:500px;width:90%;position:relative;">
      <button id="closeModal" style="position:absolute;top:12px;right:12px;border:none;background:var(--accent);color:#fff;border-radius:50%;width:32px;height:32px;cursor:pointer;">×</button>
      <img id="modalImage" style="width:100%;border-radius:12px;margin-bottom:1rem;" />
      <h2 id="modalTitle"></h2>
      <p id="modalDetails" style="margin:1rem 0;color:var(--muted);"></p>
      <a id="modalLive" target="_blank">Live Demo</a> | 
      <a id="modalCode" target="_blank">Source Code</a>
    </div>
  </div>

  <div style="display: flex; align-items: center; justify-content: center; "><button style="height: 1.5rem; border-radius: 5px;border: none;background: var(--accent); padding: 2px;"><a href="port.html" style="color: #fff; text-decoration: none;">Back to portfolio</a></button></div>

  <footer>© 2025 • Beza Portfolio</footer>

  <script>
    /* ===== SCROLL ANIMATION (DEFINED FIRST) ===== */
    const observer = new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if (entry.isIntersecting) entry.target.classList.add('show');
      });
    }, { threshold: 0.15 });

    /* ===== PROJECT DATA ===== */
    const projects = [
      {
        title: "AnimeZone",
        description: "An anime discovery website with sliders and dynamic content.",
        details: "AnimeZone lets users browse trending anime, view details, and explore genres using a clean UI.",
        image: "https://via.placeholder.com/400x220?text=AnimeZone",
        tech: ["HTML", "CSS", "JavaScript"],
        live: "#",
        code: "#"
      },
      {
        title: "E‑commerce UI",
        description: "A modern shopping interface with cart functionality and whishlist.",
        details: "This project focuses on UI/UX for online shopping with cart logic and product listings.",
        image: "https://via.placeholder.com/400x220?text=E-commerce",
        tech: ["HTML", "CSS", "JavaScript"],
        live: "#",
        code: "#"
      }
    ];

    const grid = document.getElementById('projectsGrid');

    projects.forEach(project => {
      const card = document.createElement('div');
      card.className = 'project-card';

      const techBadges = project.tech
        .map(t => `<span style="background:var(--accent);color:#fff;padding:0.25rem 0.6rem;border-radius:999px;font-size:0.75rem;margin-right:0.4rem;">${t}</span>`)
        .join('');

      card.innerHTML = `
        <img src="${project.image}" alt="${project.title}" style="width:100%;border-radius:12px;margin-bottom:1rem;transition:transform 0.4s ease;" />
        <h3>${project.title}</h3>
        <p>${project.description}</p>
        <div style="margin:0.8rem 0;">${techBadges}</div>
        <div class="project-links">
          <a href="${project.live}" target="_blank">Live Demo</a>
          <a href="${project.code}" target="_blank">Source Code</a>
          <a href="#" class="view-btn">View Details</a>
        </div>
      `;

      grid.appendChild(card);
      observer.observe(card);

      const img = card.querySelector('img');
      card.addEventListener('mouseenter', () => img.style.transform = 'scale(1.05)');
      card.addEventListener('mouseleave', () => img.style.transform = 'scale(1)');

      card.querySelector('.view-btn').addEventListener('click', e => {
        e.preventDefault();
        openModal(project);
      });
    });

    /* ===== THEME TOGGLE ===== */
    document.getElementById('themeToggle').addEventListener('click', () => {
      document.body.classList.toggle('dark');
    });

    /* ===== MODAL LOGIC ===== */
    const modal = document.getElementById('modal');
    const modalImage = document.getElementById('modalImage');
    const modalTitle = document.getElementById('modalTitle');
    const modalDetails = document.getElementById('modalDetails');
    const modalLive = document.getElementById('modalLive');
    const modalCode = document.getElementById('modalCode');

    function openModal(project) {
      modalImage.src = project.image;
      modalTitle.textContent = project.title;
      modalDetails.textContent = project.details;
      modalLive.href = project.live;
      modalCode.href = project.code;
      modal.style.display = 'flex';
    }

    document.getElementById('closeModal').addEventListener('click', () => {
      modal.style.display = 'none';
    });

    modal.addEventListener('click', e => {
      if (e.target === modal) modal.style.display = 'none';
    });
  </script>
</body>
</html>
